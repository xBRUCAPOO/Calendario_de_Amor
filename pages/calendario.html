<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Calendario · Fechas Importantes</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">

<link rel="stylesheet" href="../css/style.css?v=11">
</head>
<body>
  <div class="screen">
    <div class="top-bar">
      <div class="top-bar-left">
        <a class="icon-button" href="../index.html" aria-label="Volver">
          <span class="material-symbols-outlined">arrow_back</span>
        </a>
        <h1>Calendario</h1>
      </div>
    </div>

    <div class="calendar-header">
      <div class="calendar-month-nav">
        <button class="icon-button" id="prevMonth" aria-label="Mes anterior">
          <span class="material-symbols-outlined">chevron_left</span>
        </button>
        <h2 id="monthLabel">Septiembre 2026</h2>
        <button class="icon-button" id="nextMonth" aria-label="Mes siguiente">
          <span class="material-symbols-outlined">chevron_right</span>
        </button>
      </div>
    </div>

    <div class="weekday-row" id="weekdayRow"></div>
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>

  <!-- Botón importante: ícono + texto -->
  <button class="fab" id="openAddDay">
    <span class="material-symbols-outlined">add</span> Agregar día
  </button>

  <script src="../js/common.js?v=11"></script>
  <script src="../js/calendario.js?v=11"></script>
</body>
</html>
