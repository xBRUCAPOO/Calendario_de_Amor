<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Fechas · Fechas Importantes</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">

  <link rel="stylesheet" href="../css/style.css?v=8">
</head>
<body>
  <div class="screen">
    <div class="fechas-sticky-header">
      <div class="top-bar">
        <div class="top-bar-left">
          <button class="icon-button" id="backBtn" aria-label="Volver">
            <span class="material-symbols-outlined">arrow_back</span>
          </button>
          <h1>Fechas</h1>
        </div>
      </div>

      <div class="search-bar">
        <span class="material-symbols-outlined">search</span>
        <input type="text" id="searchInput" placeholder="Buscar por nombre...">
      </div>

      <!-- Botón que prende/apaga: alterna entre "días importantes" y "feriados" -->
      <div class="mode-toggle-row">
        <span class="mode-toggle-label" id="modeLabelDates">Días importantes</span>
        <label class="switch">
          <input type="checkbox" id="showHolidaysSwitch">
          <span class="track"><span class="thumb"></span></span>
        </label>
        <span class="mode-toggle-label" id="modeLabelHolidays">Feriados</span>
      </div>

      <!-- Filtro por categoría (no incluye "Feriado": ese modo lo maneja el switch de arriba) -->
      <div class="category-filter no-scrollbar" id="categoryFilter"></div>
    </div>

    <div class="dates-list" id="datesList"></div>
  </div>

  <script src="../js/common.js?v=8"></script>
  <script src="../js/fechas.js?v=8"></script>
</body>
</html>
